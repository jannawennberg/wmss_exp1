<!DOCTYPE html>
<html>

<head>
  <title>Memory Experiment</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js"></script>
  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <script src="jspsych_lib/jspsych-wm-stroop.js"></script>
  <link href="jspsych_lib/jspsych.css" rel="stylesheet" type="text/css">
  <script src="jspsych_lib/questionnaires.js"></script>
  <script src="https://unpkg.com/@jspsych-contrib/plugin-pipe"></script>
  <script src="https://unpkg.com/@jspsych/plugin-fullscreen@1.2.1"></script>
  <script src="https://unpkg.com/@jspsych/plugin-instructions@1.1.4"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-likert@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-multi-choice@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-multi-select@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.2.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.2.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.4"></script>
  <script src="https://unpkg.com/@jspsych/plugin-call-function@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.3"></script>

  <style>
    .jspsych-instructions-nav {
      margin-bottom: 100px;
    }

    #consentDiv {
      font-size: 12pt;
      text-align: justify;
    }

    kbd {
      display: inline-block;
      padding: 4px 10px;
      font-size: 18px;
      border: 2px solid #aaa;
      border-radius: 6px;
      background: #f5f5f5;
      font-family: monospace;
    }

    .key-mapping-table {
      margin: 20px auto;
      border-spacing: 24px 10px;
      font-size: 22px;
      text-align: center;
    }

    .key-mapping-table td {
      padding: 6px 12px;
    }

    /* Custom style for vviq instructions */
    .vviq-instructions {
      font-weight: bold;
      font-size: larger;
      margin-bottom: 20px;
    }

    /*Add some space from the bottom of likert button*/
    #jspsych-survey-likert-next {
      margin-bottom: 20px;
    }

    /*Keep likert scales consistent for each page using width*/
    #jspsych-survey-likert-form {
      display: inline-block;
      width: 700px;
      max-width: 700px;
      ;
    }

    /*Add some space from the bottom of vviq button*/
    #jspsych-survey-multi-choice-next {
      margin-bottom: 20px;
    }
  </style>
</head>

<body>
  <script>

    /* -------------------------------------------------------
       JSPSYCH INIT
    ------------------------------------------------------- */
    const jsPsych = initJsPsych({
      show_progress_bar: true,
      auto_update_progress_bar: false,
      on_finish: () => {
        // Redirect to SONA completion URL
        const sona_url = `https://ucsd.sona-systems.com/webstudy_credit.aspx?experiment_id=3100&credit_token=16f5baca2fc44b4b945a45acf09e6cb5&survey_code=${raw_sona_id}`;
        window.location = sona_url;
    }
    });

    /* -------------------------------------------------------
       PARTICIPANT ID
    ------------------------------------------------------- */
    const participant_id = jsPsych.randomization.randomID(10);
    const filename = `wmss_exp1_${participant_id}.csv`;
    jsPsych.data.addProperties({ participant_id });

    // Get the SONA id from url parameters
    const url_params = new URLSearchParams(window.location.search);
    const raw_sona_id = url_params.get('participant');
    if (raw_sona_id){
        jsPsych.data.addProperties({ raw_sona_id });
    }

    /* -------------------------------------------------------
       STIMULUS MATERIALS
    ------------------------------------------------------- */

    // Color definitions (same values as in paper)
    // Key mappings: d=blue, f=green, j=yellow, k=red
    const color_info = {
      blue: { rgb: [0, 0, 255], key: 'd', css: 'rgb(0,0,255)' },
      green: { rgb: [25, 200, 25], key: 'f', css: 'rgb(25,200,25)' },
      yellow: { rgb: [225, 215, 40], key: 'j', css: 'rgb(225,215,40)' },
      red: { rgb: [255, 0, 0], key: 'k', css: 'rgb(255,0,0)' },
    };

    // Word lists
    const wm_words_semantic = {
      blue: ["sky", "ocean", "water"],
      green: ["broccoli", "lime", "lettuce"],
      yellow: ["banana", "lemon", "corn"],
      red: ["strawberry", "blood", "tomato"],
    };

    const wm_words_original = {
      blue: ["blue"],
      green: ["green"],
      yellow: ["yellow"],
      red: ["red"],
    };

    // Foil probes for congruent-Stroop / mismatch WM trials
    // (patch color = wm_word color, so probe word needs to differ from wm_color—have 3 options)
    const congruent_stroop_probes_semantic = {
      sky:        ["broccoli", "lime", "lettuce", "banana", "lemon", "corn", "strawberry", "blood", "tomato"],
      ocean:      ["broccoli", "lime", "lettuce", "banana", "lemon", "corn", "strawberry", "blood", "tomato"],
      water:      ["broccoli", "lime", "lettuce", "banana", "lemon", "corn", "strawberry", "blood", "tomato"],
      broccoli:   ["sky", "ocean", "water", "banana", "lemon", "corn", "strawberry", "blood", "tomato"],
      lime:       ["sky", "ocean", "water", "banana", "lemon", "corn", "strawberry", "blood", "tomato"],
      lettuce:    ["sky", "ocean", "water", "banana", "lemon", "corn", "strawberry", "blood", "tomato"],
      banana:     ["sky", "ocean", "water", "broccoli", "lime", "lettuce", "strawberry", "blood", "tomato"],
      lemon:      ["sky", "ocean", "water", "broccoli", "lime", "lettuce", "strawberry", "blood", "tomato"],
      corn:       ["sky", "ocean", "water", "broccoli", "lime", "lettuce", "strawberry", "blood", "tomato"],
      strawberry: ["sky", "ocean", "water", "broccoli", "lime", "lettuce", "banana", "lemon", "corn"],
      blood:      ["sky", "ocean", "water", "broccoli", "lime", "lettuce", "banana", "lemon", "corn"],
      tomato:     ["sky", "ocean", "water", "broccoli", "lime", "lettuce", "banana", "lemon", "corn"],
    };

    const congruent_stroop_probes_original = {
      blue: ["green", "yellow", "red"],
      green: ["blue", "yellow", "red"],
      yellow: ["blue", "green", "red"],
      red: ["blue", "green", "yellow"]
    };

    // For incongruent AND mismatch trials, here are the probe words (have two color options)
    const incongruent_probes_semantic = {
      // blue words
      sky:        { red: ["broccoli","lime","lettuce","banana","lemon","corn"],    green: ["banana","lemon","corn","strawberry","blood","tomato"],    yellow: ["broccoli","lime","lettuce","strawberry","blood","tomato"] },
      ocean:      { red: ["broccoli","lime","lettuce","banana","lemon","corn"],    green: ["banana","lemon","corn","strawberry","blood","tomato"],    yellow: ["broccoli","lime","lettuce","strawberry","blood","tomato"] },
      water:      { red: ["broccoli","lime","lettuce","banana","lemon","corn"],    green: ["banana","lemon","corn","strawberry","blood","tomato"],    yellow: ["broccoli","lime","lettuce","strawberry","blood","tomato"] },
      // green words
      broccoli:   { blue: ["banana","lemon","corn","strawberry","blood","tomato"], red: ["sky","ocean","water","banana","lemon","corn"],             yellow: ["sky","ocean","water","strawberry","blood","tomato"] },
      lime:       { blue: ["banana","lemon","corn","strawberry","blood","tomato"], red: ["sky","ocean","water","banana","lemon","corn"],             yellow: ["sky","ocean","water","strawberry","blood","tomato"] },
      lettuce:    { blue: ["banana","lemon","corn","strawberry","blood","tomato"], red: ["sky","ocean","water","banana","lemon","corn"],             yellow: ["sky","ocean","water","strawberry","blood","tomato"] },
      // yellow words
      banana:     { blue: ["broccoli","lime","lettuce","strawberry","blood","tomato"], green: ["sky","ocean","water","strawberry","blood","tomato"], red: ["sky","ocean","water","broccoli","lime","lettuce"] },
      lemon:      { blue: ["broccoli","lime","lettuce","strawberry","blood","tomato"], green: ["sky","ocean","water","strawberry","blood","tomato"], red: ["sky","ocean","water","broccoli","lime","lettuce"] },
      corn:       { blue: ["broccoli","lime","lettuce","strawberry","blood","tomato"], green: ["sky","ocean","water","strawberry","blood","tomato"], red: ["sky","ocean","water","broccoli","lime","lettuce"] },
      // red words
      strawberry: { blue: ["broccoli","lime","lettuce","banana","lemon","corn"],   green: ["sky","ocean","water","banana","lemon","corn"],           yellow: ["sky","ocean","water","broccoli","lime","lettuce"] },
      blood:      { blue: ["broccoli","lime","lettuce","banana","lemon","corn"],   green: ["sky","ocean","water","banana","lemon","corn"],           yellow: ["sky","ocean","water","broccoli","lime","lettuce"] },
      tomato:     { blue: ["broccoli","lime","lettuce","banana","lemon","corn"],   green: ["sky","ocean","water","banana","lemon","corn"],           yellow: ["sky","ocean","water","broccoli","lime","lettuce"] },
    };

    const incongruent_probes_original = {
      // blue words — probe can't be blue blue, probe can't be patch color
      blue: { green: ["yellow", "red"], yellow: ["green", "red"], red: ["green", "yellow"] },
      green: { blue: ["yellow", "red"], yellow: ["blue", "red"], red: ["blue", "yellow"] },
      yellow: { blue: ["green", "red"], green: ["blue", "red"], red: ["blue", "green"] },
      red: { blue: ["green", "yellow"], green: ["blue", "yellow"], yellow: ["blue", "green"] }
    };

    // Which colors can serve as foil patches for each color
    const other_colors = {
      blue: ["red", "green", "yellow"],
      green: ["blue", "red", "yellow"],
      yellow: ["blue", "green", "red"],
      red: ["blue", "green", "yellow"],
    };

    /* -------------------------------------------------------
       GENERATE TRIAL TIMELINE VARIABLES
    ------------------------------------------------------- */
    function generate_timeline_variables_original(wm_words_original, repetitions = 1) {
      const trials_original = [];
      let idx = 0;
      for (let rep = 0; rep < repetitions; rep++) {
        for (const [wm_color, words] of Object.entries(wm_words_original)) {
          for (const wm_word of words) {

            // Condition 1: stim_congruent=true, wm_congruent=true
            trials_original.push({
              task_trial_index: idx++,
              wm_color, wm_word,
              patch_color: wm_color,
              wm_probe: wm_word,
              stim_congruent: true,
              wm_congruent: true,
            });

            // Condition 2: stim_congruent=true, wm_congruent=false
            const curr_wm_probe_cong = jsPsych.randomization.sampleWithoutReplacement(congruent_stroop_probes_original[wm_word], 1)[0];
            trials_original.push({
              task_trial_index: idx++,
              wm_color, wm_word,
              patch_color: wm_color,
              wm_probe: curr_wm_probe_cong,
              stim_congruent: true,
              wm_congruent: false,
            });

            // Condition 3: stim_congruent=false, wm_congruent=true
            const patch_foil_c3 = other_colors[wm_color][Math.floor(Math.random() * other_colors[wm_color].length)];
            trials_original.push({
              task_trial_index: idx++,
              wm_color, wm_word,
              patch_color: patch_foil_c3,
              wm_probe: wm_word,
              stim_congruent: false,
              wm_congruent: true,
            });

            // Condition 4: stim_congruent=false, wm_congruent=false
            const patch_foil_c4 = other_colors[wm_color][Math.floor(Math.random() * other_colors[wm_color].length)];
            const curr_wm_probe_incong = jsPsych.randomization.sampleWithoutReplacement(incongruent_probes_original[wm_word][patch_foil_c4], 1)[0];
            trials_original.push({
              task_trial_index: idx++,
              wm_color, wm_word,
              patch_color: patch_foil_c4,
              wm_probe: curr_wm_probe_incong,
              stim_congruent: false,
              wm_congruent: false,
            });
          }
        }
      }
      return trials_original
    }

    function generate_timeline_variables_semantic(wm_words_semantic, repetitions = 1) {
      const trials_semantic = [];
      let idx = 0;
      for (let rep = 0; rep < repetitions; rep++) {
        for (const [wm_color, words] of Object.entries(wm_words_semantic)) {
          for (const wm_word of words) {

            // Condition 1: stim_congruent=true, wm_congruent=true
            trials_semantic.push({
              task_trial_index: idx++,
              wm_color, wm_word,
              patch_color: wm_color,
              wm_probe: wm_word,
              stim_congruent: true,
              wm_congruent: true,
            });

            // Condition 2: stim_congruent=true, wm_congruent=false
            const wm_probe_c2 = jsPsych.randomization.sampleWithoutReplacement(congruent_stroop_probes_semantic[wm_word], 1)[0];
            trials_semantic.push({
              task_trial_index: idx++,
              wm_color, wm_word,
              patch_color: wm_color,
              wm_probe: wm_probe_c2,
              stim_congruent: true,
              wm_congruent: false,
            });

            // Condition 3: stim_congruent=false, wm_congruent=true
            const patch_foil_c3 = other_colors[wm_color][Math.floor(Math.random() * other_colors[wm_color].length)];
            trials_semantic.push({
              task_trial_index: idx++,
              wm_color, wm_word,
              patch_color: patch_foil_c3,
              wm_probe: wm_word,
              stim_congruent: false,
              wm_congruent: true,
            });

            // Condition 4: stim_congruent=false, wm_congruent=false
            const patch_foil_c4 = other_colors[wm_color][Math.floor(Math.random() * other_colors[wm_color].length)];
            const wm_probe_c4 = jsPsych.randomization.sampleWithoutReplacement(incongruent_probes_semantic[wm_word][patch_foil_c4], 1)[0]
            trials_semantic.push({
              task_trial_index: idx++,
              wm_color, wm_word,
              patch_color: patch_foil_c4,
              wm_probe: wm_probe_c4,
              stim_congruent: false,
              wm_congruent: false,
            });
          }
        }
      }
      return trials_semantic;
    }

    const all_trials_semantic = generate_timeline_variables_semantic(wm_words_semantic, 2);
    const all_trials_original = generate_timeline_variables_original(wm_words_original, 6);
    const all_trials = [...all_trials_semantic, ...all_trials_original];

    /* -------------------------------------------------------
       PRACTICE TRIALS (10 fixed trials, one per condition
       mix, covering all 4 colors)
    ------------------------------------------------------- */
    const practice_trials = [
      // semantic words
      { wm_color: "blue",   wm_word: "sky",        patch_color: "blue",   wm_probe: "sky",        stim_congruent: true,  wm_congruent: true  },
      { wm_color: "green",  wm_word: "broccoli",   patch_color: "red",    wm_probe: "broccoli",   stim_congruent: false, wm_congruent: true  },
      { wm_color: "yellow", wm_word: "banana",     patch_color: "yellow", wm_probe: "lime",        stim_congruent: true,  wm_congruent: false },
      { wm_color: "red",    wm_word: "strawberry", patch_color: "blue",   wm_probe: "corn",        stim_congruent: false, wm_congruent: false },
      { wm_color: "blue",   wm_word: "ocean",      patch_color: "green",  wm_probe: "ocean",       stim_congruent: false, wm_congruent: true  },
      { wm_color: "green",  wm_word: "lettuce",    patch_color: "green",  wm_probe: "tomato",      stim_congruent: true,  wm_congruent: false },
      // original words
      { wm_color: "blue",   wm_word: "blue",       patch_color: "blue",   wm_probe: "blue",        stim_congruent: true,  wm_congruent: true  },
      { wm_color: "green",  wm_word: "green",      patch_color: "green",  wm_probe: "yellow",      stim_congruent: true,  wm_congruent: false },
      { wm_color: "yellow", wm_word: "yellow",     patch_color: "red",    wm_probe: "yellow",      stim_congruent: false, wm_congruent: true  },
      { wm_color: "red",    wm_word: "red",        patch_color: "blue",   wm_probe: "green",       stim_congruent: false, wm_congruent: false },
    ];

    /* -------------------------------------------------------
       TIMELINE
    ------------------------------------------------------- */
    const timeline = [];
    const n_main_trials = all_trials.length; // 192
    const n_trials_block = 24;

    // --- Fullscreen ---
    timeline.push({
      type: jsPsychFullscreen,
      fullscreen_mode: true,
    });

    // --- Welcome ---
    timeline.push({
      type: jsPsychHtmlButtonResponse,
      stimulus: `
        <p><strong>Welcome to the Memory Experiment!</strong></p>
        <p>This study will take approximately 60 minutes.</p>
        <p><strong>To complete this experiment, you must be on a laptop or desktop computer with a physical keyboard.</strong></p>
        <p>You must also be <strong>fluent in English</strong> and have normal or corrected-to-normal <strong>color vision</strong>.</strong></p>
        <p>Press "Continue" to the Consent Form.</p>
      `,
      choices: ["Continue"],
    });

    // --- Task instructions ---
    timeline.push({
      type: jsPsychInstructions,
      pages: [
        `<p><strong>Task Overview</strong></p>
         <p>In this experiment, you will complete a <strong>working memory color task</strong>.</p>
         <p>Each trial has three parts:</p>
         <ol style="text-align:left; display:inline-block;">
           <li>You will see a <strong>word</strong> — your job is to remember it!</li>
           <li>Next, a <strong>colored rectangle</strong> will briefly appear. You will then press a key to indicate its color as quickly and accurately as possible.</li>
           <li>Finally, a <strong>test word</strong> will appear. Press <kbd>G</kbd> if it matches the word you saw at the start, or <kbd>H</kbd> if it does not.</li>
         </ol>
         <p><strong>In sum, on each trial, you will make two responses: the first response is to judge the color of the patch. The second response is to indicate whether the word displayed matches the word you saw at the start of the trial.</strong></p>
         <p>Click "Next" to learn the color key mappings.</p>`,

        `<p><strong>Color Key Mappings</strong></p>
         <p>Press the key that matches the color of the rectangle:</p>
         <table class="key-mapping-table">
           <tr>
             <td><span style="color:rgb(0,0,255); font-size:48px;">■</span></td>
             <td><span style="color:rgb(25,200,25); font-size:48px;">■</span></td>
             <td><span style="color:rgb(225,215,40); font-size:48px;">■</span></td>
             <td><span style="color:rgb(255,0,0); font-size:48px;">■</span></td>
           </tr>
           <tr>
             <td><kbd>D</kbd><br>Blue</td>
             <td><kbd>F</kbd><br>Green</td>
             <td><kbd>J</kbd><br>Yellow</td>
             <td><kbd>K</kbd><br>Red</td>
           </tr>
         </table>
         <p>For the memory test at the end of each trial:<br>
           <kbd>G</kbd> = Same &nbsp;&nbsp; <kbd>H</kbd> = Different
         </p>
         <p>Click "Next" to practice the color keys.</p>`,
      ],
      show_clickable_nav: true,
      button_label_next: "Next",
      button_label_previous: "Back",
    });

    /* -------------------------------------------------------
       KEY MAPPING TRAINING
       Shows each color patch one at a time; participant must
       press the correct key before moving on.
    ------------------------------------------------------- */
    timeline.push({
      type: jsPsychHtmlButtonResponse,
      stimulus: `
        <p>Learn these key mappings:</p>
        <table class="key-mapping-table">
            <tr>
                <td><div style="width:80px; height:60px; background-color:rgb(0,0,255);"></div></td>
                <td><div style="width:80px; height:60px; background-color:rgb(25,200,25);"></div></td>
                <td><div style="width:80px; height:60px; background-color:rgb(225,215,40);"></div></td>
                <td><div style="width:80px; height:60px; background-color:rgb(255,0,0);"></div></td>
            </tr>
            <tr>
                <td><kbd>D</kbd> Blue</td>
                <td><kbd>F</kbd> Green</td>
                <td><kbd>J</kbd> Yellow</td>
                <td><kbd>K</kbd> Red</td>
            </tr>
        </table>
    `,
      choices: ["I've got it, test me!"],
    });
    const key_training_trials = [
      { stimulus: `<p>What color is this?</p><div style="width:200px; height:150px; background-color:rgb(0,0,255); margin:20px auto;"></div>`, correct_key: 'd' },
      { stimulus: `<p>What color is this?</p><div style="width:200px; height:150px; background-color:rgb(25,200,25); margin:20px auto;"></div>`, correct_key: 'f' },
      { stimulus: `<p>What color is this?</p><div style="width:200px; height:150px; background-color:rgb(225,215,40); margin:20px auto;"></div>`, correct_key: 'j' },
      { stimulus: `<p>What color is this?</p><div style="width:200px; height:150px; background-color:rgb(255,0,0); margin:20px auto;"></div>`, correct_key: 'k' },
    ];

    var key_training_block = {
      timeline: [
        // Show the patch, wait for keypress
        {
          type: jsPsychHtmlKeyboardResponse,
          stimulus: jsPsych.timelineVariable('stimulus'),
          choices: ['d', 'f', 'j', 'k'],
          on_finish: function (data) {
            data.correct = (data.response === jsPsych.timelineVariable('correct_key'));
          }
        },
        // Show feedback immediately after
        {
          type: jsPsychHtmlKeyboardResponse,
          stimulus: function () {
            const last = jsPsych.data.get().last(1).values()[0];
            if (last.correct) {
              return `<p style="color: black; font-size: 32px;">✓ Correct!</p>`;
            } else {
              const correct_key = jsPsych.timelineVariable('correct_key');
              const color_name = { 'd': 'Blue', 'f': 'Green', 'j': 'Yellow', 'k': 'Red' }[correct_key];
              return `<p style="color: black; font-size: 32px;">✗ Incorrect!</p>
                            <p>The correct key for this color is <kbd>${correct_key.toUpperCase()}</kbd> (${color_name})</p>`;
            }
          },
          choices: [],
          trial_duration: 1000,  // show feedback for 1 second then move on
        }
      ],
      timeline_variables: key_training_trials,
      repetitions: 5,
      randomize_order: true,
    };

    timeline.push(key_training_block)

    timeline.push({
      type: jsPsychHtmlButtonResponse,
      stimulus: `
        <p>Great! Now you'll do a short <strong>practice</strong> with the full task.</p>
        <p>You will receive feedback after each trial during practice.</p>
        <p>Remember:</p>
        <ul style="text-align:left; display:inline-block;">
          <li>Remember the <strong>word</strong> at the start of each trial.</li>
          <li>Press the <strong>color key</strong> (D/F/J/K) when the rectangle appears.</li>
          <li>Press <strong>G</strong> (same) or <strong>H</strong> (different) for the word memory test.</li>
        </ul>
      `,
      choices: ["Start Practice"],
    });

    /* -------------------------------------------------------
       PRACTICE BLOCK (10 trials, with feedback)
    ------------------------------------------------------- */
    var practice_block = {
      timeline: [{
        type: jsPsychWMStroop,
        is_practice: true,
        // slower presentation during practice trials
        wm_sample_time: 1500,
        color_patch_time: 1000,
        wm_response_time: 4000,

        wm_word: jsPsych.timelineVariable('wm_word'),
        wm_color: jsPsych.timelineVariable('wm_color'),
        patch_color: jsPsych.timelineVariable('patch_color'),
        wm_probe: jsPsych.timelineVariable('wm_probe'),
        stim_congruent: jsPsych.timelineVariable('stim_congruent'),
        wm_congruent: jsPsych.timelineVariable('wm_congruent'),
      }],
      timeline_variables: practice_trials,
      randomize_order: true,
    };

    timeline.push(practice_block);

    // Transition from practice to main task
    timeline.push({
      type: jsPsychHtmlButtonResponse,
      stimulus: `
        <p><strong>Practice complete!</strong></p>
        <p>The main experiment will now begin. There are <strong>192 trials</strong> split into eight blocks of 24.</p>
        <p>You will <strong>not</strong> receive feedback during the main task.</p>
        <p>Take a moment to review the key mappings if needed:</p>
        <table class="key-mapping-table">
          <tr>
            <td><span style="color:rgb(0,0,255); font-size:40px;">■</span></td>
            <td><span style="color:rgb(25,200,25); font-size:40px;">■</span></td>
            <td><span style="color:rgb(225,215,40); font-size:40px;">■</span></td>
            <td><span style="color:rgb(255,0,0); font-size:40px;">■</span></td>
          </tr>
          <tr>
            <td><kbd>D</kbd> Blue</td>
            <td><kbd>F</kbd> Green</td>
            <td><kbd>J</kbd> Yellow</td>
            <td><kbd>K</kbd> Red</td>
          </tr>
        </table>
        <p><kbd>G</kbd> = Same &nbsp;&nbsp; <kbd>H</kbd> = Different</p>
      `,
      choices: ["Begin Experiment"],
    });

    /* -------------------------------------------------------
       MAIN TASK — split into two blocks of 24
    ------------------------------------------------------- */
    var trial_count = 0;
    var updateCounter = () => {
      trial_count++;
      jsPsych.setProgressBar(trial_count / n_main_trials);
    };

    // Randomize all trials
    const shuffled_trials = jsPsych.randomization.shuffle(all_trials);
    const block1_trials = shuffled_trials.slice(0, 24);
    const block2_trials = shuffled_trials.slice(24, 48);
    const block3_trials = shuffled_trials.slice(48, 72);
    const block4_trials = shuffled_trials.slice(72, 96);
    const block5_trials = shuffled_trials.slice(96, 120);
    const block6_trials = shuffled_trials.slice(120, 144);
    const block7_trials = shuffled_trials.slice(144, 168);
    const block8_trials = shuffled_trials.slice(168, 192);
    
    function makeBlock(trials) {
      return {
        timeline: [{
          type: jsPsychWMStroop,
          is_practice: false,
          wm_word: jsPsych.timelineVariable('wm_word'),
          wm_color: jsPsych.timelineVariable('wm_color'),
          patch_color: jsPsych.timelineVariable('patch_color'),
          wm_probe: jsPsych.timelineVariable('wm_probe'),
          stim_congruent: jsPsych.timelineVariable('stim_congruent'),
          wm_congruent: jsPsych.timelineVariable('wm_congruent'),
          task_trial_index: jsPsych.timelineVariable('task_trial_index'),
          on_finish: updateCounter,
        }],
        timeline_variables: trials,
      };
    }

    function breakScreen(blockNum, totalBlocks) {
      return {
        type: jsPsychHtmlButtonResponse,
        stimulus: `
          <p><strong>Block ${blockNum - 1} of ${totalBlocks} complete!</strong></p>
          <p>Feel free to take a short break.</p>
          <p>As a reminder, here are the key mappings:</p>
          <table class="key-mapping-table">
            <tr>
              <td><div style="width:80px; height:60px; background-color:rgb(0,0,255);"></div></td>
              <td><div style="width:80px; height:60px; background-color:rgb(25,200,25);"></div></td>
              <td><div style="width:80px; height:60px; background-color:rgb(225,215,40);"></div></td>
              <td><div style="width:80px; height:60px; background-color:rgb(255,0,0);"></div></td>
            </tr>
            <tr>
              <td><kbd>D</kbd> Blue</td>
              <td><kbd>F</kbd> Green</td>
              <td><kbd>J</kbd> Yellow</td>
              <td><kbd>K</kbd> Red</td>
            </tr>
          </table>
          <p><kbd>G</kbd> = Same &nbsp;&nbsp; <kbd>H</kbd> = Different</p>
        `,
        choices: ["Continue"],
      };
    }

    timeline.push(makeBlock(block1_trials));
    timeline.push(breakScreen(2, 8));
    timeline.push(makeBlock(block2_trials));
    timeline.push(breakScreen(3, 8));
    timeline.push(makeBlock(block3_trials));
    timeline.push(breakScreen(4, 8));
    timeline.push(makeBlock(block4_trials));
    timeline.push(breakScreen(5, 8));
    timeline.push(makeBlock(block5_trials));
    timeline.push(breakScreen(6, 8));
    timeline.push(makeBlock(block6_trials));
    timeline.push(breakScreen(7, 8));
    timeline.push(makeBlock(block7_trials));
    timeline.push(breakScreen(8, 8));
    timeline.push(makeBlock(block8_trials));

    /* -------------------------------------------------------
       IMAGERY QUESTIONNAIRES
    ------------------------------------------------------- */
    timeline.push({
      type: jsPsychHtmlButtonResponse,
      stimulus: '<p><b>Welcome to the second part of the study!</b></p><p>In this section, you will be presented with a series of statements. Please indicate your level of agreement or disagreement with each one.</p>',
      choices: ['Continue'],

      on_start: function () {
        // reset progress bar
        jsPsych.setProgressBar(0);
      },
    });

    // Shuffle the questionnaire arrays and chunk into sections
    shuffleArray(osivq);
    // Chunk osivq items into groups of 5 and add to timeline
    while (osivq.length > 0) {
      let itemsChunk = osivq.splice(0, 6); // Get next chunk of 5 items
      timeline.push(generateOsivqTrial(itemsChunk));
    }

    // Shuffle IRQ questions
    shuffleArray(irq); // Shuffle the items initially

    // Chunk items into groups of 4 and add to timeline
    while (irq.length > 0) {
      let itemsChunk = irq.splice(0, 5); // Get next chunk of 4 items
      timeline.push(generateIrqTrial(itemsChunk));
    }

    // VVIQ Instructions
    timeline.push({
      type: jsPsychHtmlButtonResponse,
      stimulus: `
      <p>Please read the instructions before moving to the next page.</p>
      <p>Visual imagery refers to the ability to visualize, that is, the ability to form mental pictures, or to “see in the mind\'s eye.”</p>
      <p>The aim of this test is to determine the vividness of your visual imagery. The items of the test will possibly bring certain images to your mind.</p>
      <p>You are asked to rate the vividness of each image by reference to the 5-point scale given below: '
        <ul style="display: inline-block; text-align: left;">
          <li>1: No image at all</li>
          <li>2: Vague and dim</li>
          <li>3: Moderately clear and vivid</li>
          <li>4: Reasonably clear and vivid</li>
          <li>5: Perfectly clear & vivid as if I was actually seeing it</li>
        <ul>
      <p>After reading each item, close your eyes for a moment, try to visualize the item, and then open your eyes and rate the item.</p>
      `,
      choices: ['Continue']
    });

    // Instruction messages for each VVIQ screen
    const vviqInstructions = [
      "In answering items 1 to 4, think of some relative or friend whom you frequently see and consider carefully the picture that comes your mind\’s eye.",
      "In answering items 5 to 8, visualize a sun. Consider the picture that comes before your mind\'s eye.",
      "In answering items 9 to 12, think of the front of a shop you often go to. Consider the picture that comes before your mind\'s eye.",
      "Finally, think of the front of a country scene which involves trees, mountains, and a lake. Consider the picture that comes before your mind\'s eye."
    ];

    // Adjust the loop to chunk VVIQ items into groups of 4 and add to timeline with instructions
    for (let i = 0; i < vviq.length; i += 4) {
      let itemsChunk = vviq.slice(i, i + 4); // Use slice to avoid modifying the original array
      let instructionIndex = i / 4; // Calculate instruction index based on the current chunk
      timeline.push(generateVVIQTrial(itemsChunk, instructionIndex));
    }

    /* -------------------------------------------------------
       END SCREEN
    ------------------------------------------------------- */
    timeline.push({
      type: jsPsychInstructions,
      pages: ['<p>Thank you for participating!</p><p>Press "Back to SONA" to be taken back to SONA</p><p><strong>You must do so in order to receive credit!</strong></p>'
      ],
      show_clickable_nav: true,
      button_label_next: 'Back to SONA',
    }); 

    // save data
    timeline.push({
      type: jsPsychPipe,
      action: "save",
      experiment_id: "O2NXsfMgurcm",
      filename: filename,
      data_string: () => jsPsych.data.get().csv()
    });

    jsPsych.run(timeline);
    

    /* -------------------------------------------------------
       Imagery helper functions
    ------------------------------------------------------- */
    // Shuffle the items array
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]]; // Swap elements
      }
    }

    // Function to generate a trial for a chunk of osivq items
    function generateOsivqTrial(itemsChunk) {
      return {
        type: jsPsychSurveyLikert,
        questions: itemsChunk.map(item => ({
          prompt: item.item,
          labels: ['1', '2', '3', '4', '5'],
          required: true
        })),
        on_finish: function (data) {
          // Attach additional data to the data object
          data.item_ids = itemsChunk.map(i => i.item_id);
          data.items = itemsChunk.map(i => i.item);
          data.categories = itemsChunk.map(i => i.category);
          data.questionnaires = itemsChunk.map(i => i.questionnaire);

          //set progress bar value
          var curr_progress_bar_value = jsPsych.getProgressBarCompleted();
          jsPsych.setProgressBar(curr_progress_bar_value + (1 / 20));

        }
      };
    }

    /// Function to generate a trial for a chunk of items
    function generateIrqTrial(itemsChunk) {
      return {
        type: jsPsychSurveyLikert,
        questions: itemsChunk.map(item => ({
          prompt: item.item,
          labels: ['1', '2', '3', '4', '5'],
          required: true
        })),
        on_finish: function (data) {
          data.item_ids = itemsChunk.map(i => i.item_id);
          data.items = itemsChunk.map(i => i.item);
          data.categories = itemsChunk.map(i => i.category);
          data.questionnaires = itemsChunk.map(i => i.questionnaire);

          //set progress bar value
          var curr_progress_bar_value = jsPsych.getProgressBarCompleted();
          jsPsych.setProgressBar(curr_progress_bar_value + (1 / 20));

        }
      };
    }

    function generateVVIQTrial(itemsChunk, instructionIndex) {
      return {
        type: jsPsychSurveyMultiChoice,
        preamble: `<div class="vviq-instructions">${vviqInstructions[instructionIndex]}</div>`, // Include the prompt
        questions: itemsChunk.map(item => ({
          prompt: item.item,
          options: ['No image at all, I only "know" I am thinking of the object',
            'Dim and vague image',
            'Moderately realistic and vivid',
            'Realistic and reasonably vivid',
            'Perfectly realistic, as vivid as real seeing'],
          required: true
        })),
        on_finish: function (data) {
          // Data processing
          data.item_ids = itemsChunk.map(i => i.item_id);
          data.items = itemsChunk.map(i => i.item);
          data.categories = itemsChunk.map(i => i.category);
          data.questionnaires = itemsChunk.map(i => i.questionnaire);

          //set progress bar value
          var curr_progress_bar_value = jsPsych.getProgressBarCompleted();
          jsPsych.setProgressBar(curr_progress_bar_value + (1 / 20));
        }
      };
    }

  </script>
</body>
